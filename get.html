<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Get Climby Social</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111418;
    color: #F7F9FC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .msg {
    font-size: 14px;
    letter-spacing: 2px;
    color: #9BA3AF;
  }
</style>
</head>
<body>
<div class="msg">OPENING CLIMBY...</div>
<noscript>
  <p style="color:#F7F9FC;padding:20px;">
    JavaScript disabled. <a style="color:#F2C548;" href="https://climbyapp.com">Go to climbyapp.com</a>
  </p>
</noscript>

<script>
  (function() {
    var APP_STORE = 'https://apps.apple.com/it/app/climby-social/id6757445704';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.climby.app';
    var WEBSITE = 'https://climbyapp.com';

    var ua = navigator.userAgent || navigator.vendor || window.opera || '';
    var isIOS = (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /android/i.test(ua);

    var dest = WEBSITE;
    if (isIOS) dest = APP_STORE;
    else if (isAndroid) dest = PLAY_STORE;

    window.location.replace(dest);
  })();
</script>
</body>
</html>
